<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test embed.html · ricezione postMessage</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1280px; margin: 0 auto; padding: 24px;
      background: #f9fafb; color: #111827;
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p.lead { color: #6b7280; margin: 0 0 18px; font-size: 0.92rem; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar a, .toolbar button {
      padding: 8px 14px; border-radius: 6px; font-size: 0.85rem;
      text-decoration: none; cursor: pointer; border: 1px solid #d1d5db;
      background: white; color: #374151; font-family: inherit;
    }
    .toolbar a.active, .toolbar button.active { background: #4f46e5; color: white; border-color: #4f46e5; }
    .container {
      display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr); gap: 16px;
    }
    @media (max-width: 800px) {
      .container { grid-template-columns: 1fr; }
    }
    .iframe-wrap {
      background: white; border: 1px solid #e5e7eb; border-radius: 10px;
      overflow: hidden; min-height: 400px;
    }
    .iframe-wrap.dark { background: #1e1b4b; }
    iframe {
      border: 0; width: 100%; display: block;
      transition: height 0.25s ease;
    }
    .log {
      background: #0f172a; color: #fde047;
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 12px;
      padding: 14px; border-radius: 10px;
      height: 600px; overflow: auto;
    }
    .log .msg { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); word-break: break-all; }
    .log .msg .t { color: #6b7280; margin-right: 6px; }
    .log .msg .n { color: #34d399; font-weight: 700; }
    .log .info { color: #94a3b8; }
    .clear-btn {
      background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.15);
      padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; float: right;
    }
  </style>
</head>
<body>
  <h1>Test postMessage di <code>embed.html</code></h1>
  <p class="lead">Iframe a sinistra, log dei messaggi <code>qi:*</code> ricevuti dal parent a destra. L'altezza dell'iframe si auto-aggiorna in base ai messaggi <code>qi:height</code>.</p>

  <div class="toolbar">
    <strong style="align-self:center; margin-right:6px;">Variante:</strong>
    <a href="?" id="btn-default" class="active">default</a>
    <a href="?bg=transparent" id="btn-transparent">?bg=transparent</a>
    <a href="?bg=dark" id="btn-dark">?bg=dark</a>
  </div>

  <div class="container">
    <div class="iframe-wrap" id="iframe-wrap">
      <iframe id="qi-iframe" src="" title="Test ICAR-16 embed"></iframe>
    </div>
    <div class="log" id="log">
      <button class="clear-btn" onclick="document.getElementById('log').querySelectorAll('.msg').forEach(n=>n.remove());">clear</button>
      <div class="msg info">In ascolto di messaggi qi:* da embed.html ...</div>
    </div>
  </div>

  <script>
    // Determina query corrente e imposta iframe + bg
    const params = new URLSearchParams(location.search);
    const bg = params.get('bg') || '';
    const iframe = document.getElementById('qi-iframe');
    const wrap = document.getElementById('iframe-wrap');
    iframe.src = 'embed.html' + (bg ? '?bg=' + bg : '');
    wrap.classList.toggle('dark', bg === 'dark');

    // Highlight bottone attivo
    document.querySelectorAll('.toolbar a').forEach(a => {
      a.classList.toggle('active', new URL(a.href, location.href).search === location.search);
    });

    const log = document.getElementById('log');
    function append(msg, isInfo) {
      const t = new Date().toLocaleTimeString('it-IT');
      const div = document.createElement('div');
      div.className = 'msg' + (isInfo ? ' info' : '');
      div.innerHTML = `<span class="t">[${t}]</span>${msg}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    window.addEventListener('message', (e) => {
      // Filtra solo i nostri messaggi (origine cross-origin compatibile localhost)
      if (!e.data || typeof e.data !== 'object' || typeof e.data.type !== 'string' || !e.data.type.startsWith('qi:')) return;
      const { type, ...rest } = e.data;
      const restJson = Object.keys(rest).length ? ' ' + JSON.stringify(rest) : '';
      append(`<span class="n">${type}</span>${restJson}`);
      console.log('[parent] received', e.data);
      if (type === 'qi:height') {
        iframe.style.height = e.data.value + 'px';
      }
    });
  </script>
</body>
</html>
